services:
  huazhu-checkin:
    build: .
    # 或直接用预构建镜像(免本地 build):
    #   image: ghcr.io/dimlitter/huazhu-auto-checkin:latest
    image: huazhu-checkin:latest
    container_name: huazhu-checkin
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MODE: "--loop"          # --loop 常驻定时; --once 执行一次
      RUN_AT: "09:05"         # 每天签到时间
      HZ_TOKEN: "在这里填你的_userToken"   # 必填, 见 README 获取方法; 多账号用 & 分隔
      # 可选: 持久化 token, 支持服务器滑动续期时自动保存新 token
      # HZ_TOKEN_FILE: "/app/data/token.txt"
      # PushPlus 微信推送(可选)
      PUSHPLUS_TOKEN: ""
      PUSHPLUS_TOPIC: ""
      NOTIFY_ON: "all"        # all / fail / success
      DEBUG: "0"
    volumes:
      - ./data:/app/data      # 持久化 token / 运行数据
